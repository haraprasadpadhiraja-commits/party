<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About College · Fresher Party 2026</title>
    <link rel="icon" href="images/favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div data-nav="about"></div>
<div data-footer></div>

<section class="page-hero small"><div class="container">
    <h1 class="fade-up">🏫 About Our College</h1>
    <p class="fade-up" id="aboutSub"></p>
</div></section>

<section class="section"><div class="container">
    <div class="about-hero card fade-up" id="aboutHero"></div>

    <div class="about-grid">
        <div class="card about-card fade-up"><h3>👁️ Our Vision</h3><p id="vision"></p></div>
        <div class="card about-card fade-up"><h3>🎯 Our Mission</h3><p id="mission"></p></div>
    </div>

    <div class="about-grid">
        <div class="card about-card fade-up"><h3>📚 Courses Offered</h3><ul class="bullet-list" id="courses"></ul></div>
        <div class="card about-card fade-up"><h3>🏛️ Branches</h3><ul class="bullet-list" id="branches"></ul></div>
        <div class="card about-card fade-up"><h3>🛠️ Facilities</h3><ul class="bullet-list" id="facilities"></ul></div>
    </div>

    <div class="card about-card fade-up"><h3>👩‍🏫 From the Principal</h3>
        <blockquote class="principal-quote" id="principalMsg"></blockquote>
        <p class="principal-name" id="principalName"></p></div>

    <div class="card about-card contact-card fade-up"><h3>📞 Contact Us</h3>
        <div class="contact-grid" id="contactGrid"></div></div>
</div></section>

<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/components.js"></script>
<script src="js/about.js"></script>
</body>
</html>
